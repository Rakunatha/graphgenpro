services:
  - type: web
    name: graphgen-pro
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 1 --timeout 300 --keep-alive 5 --max-requests 30 --max-requests-jitter 10"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
