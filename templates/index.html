<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphGen Pro</title>
<style>
  :root{
    --blue:#2f5fa8; --blue-dark:#1e4177; --bg:#f4f6f9; --card:#ffffff;
    --text:#1c1f26; --muted:#6b7280; --green:#1a7f37; --red:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:#fff; padding:28px 20px; text-align:center;
  }
  header h1{margin:0; font-size:28px; letter-spacing:.5px;}
  header p{margin:6px 0 0; opacity:.9; font-size:14px;}
  .wrap{max-width:900px; margin:0 auto; padding:24px 16px 60px;}
  .card{
    background:var(--card); border-radius:14px; padding:26px;
    box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:22px;
  }
  .drop{
    border:2px dashed #b9c3d6; border-radius:12px; padding:36px 20px;
    text-align:center; cursor:pointer; transition:.15s; background:#fafcff;
  }
  .drop:hover, .drop.drag{border-color:var(--blue); background:#eef4ff;}
  .drop input{display:none;}
  .drop .icon{font-size:38px; margin-bottom:6px;}
  .drop .fname{margin-top:10px; font-weight:600; color:var(--blue-dark);}
  button{
    background:var(--blue); color:#fff; border:none; border-radius:8px;
    padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer;
    transition:.15s;
  }
  button:hover{background:var(--blue-dark);}
  button:disabled{background:#9aa7bd; cursor:not-allowed;}
  .row{display:flex; gap:12px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
  .status{text-align:center; margin-top:14px; font-size:14px; color:var(--muted);}
  .status.err{color:var(--red); font-weight:600;}
  .spinner{
    width:34px; height:34px; border:4px solid #dbe3f0; border-top-color:var(--blue);
    border-radius:50%; margin:16px auto; animation:spin 1s linear infinite; display:none;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .stats{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:18px 0;}
  .stat{background:#eef4ff; border-radius:10px; padding:12px 18px; text-align:center; min-width:120px;}
  .stat b{display:block; font-size:22px; color:var(--blue-dark);}
  .stat span{font-size:12px; color:var(--muted);}
  .anova-box{
    border:1px solid #e2e8f0; border-radius:10px; padding:16px; margin-top:14px;
  }
  .sig-yes{color:var(--green); font-weight:700;}
  .sig-no{color:var(--red); font-weight:700;}
  .chart-card{border:1px solid #e6eaf0; border-radius:10px; padding:14px; margin-bottom:16px;}
  .chart-card img{width:100%; border-radius:6px;}
  .chart-card .legend{font-size:13px; color:var(--muted); margin-top:8px;}
  .chart-card h4{margin:0 0 8px; font-size:14px;}
  h2{font-size:19px; margin-top:0;}
  .hidden{display:none;}
  .note{font-size:12px; color:var(--muted); text-align:center; margin-top:6px;}
  .download-btn{background:var(--green);}
  .download-btn:hover{background:#145c29;}
</style>
</head>
<body>

<header>
  <h1>📊 GraphGen Pro</h1>
  <p>Upload survey data &rarr; auto-generate SPSS-style comparison charts &rarr; run an ANOVA &rarr; download a Word report</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>1. Upload your data</h2>
    <label class="drop" id="dropZone">
      <div class="icon">📁</div>
      <div>Click to choose, or drag &amp; drop a .xlsx / .csv file</div>
      <div class="fname" id="fileName"></div>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    </label>
    <div class="row">
      <button id="analyzeBtn" disabled>Analyze Data</button>
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="card hidden" id="resultsCard">
    <h2>2. Results</h2>
    <div class="stats" id="statsRow"></div>

    <div id="anovaSection"></div>

    <div class="row">
      <button class="download-btn" id="downloadBtn">⬇️ Download Full Word Report</button>
    </div>
    <p class="note" id="chartNote"></p>

    <h2 style="margin-top:26px;">Preview charts</h2>
    <div id="chartsContainer"></div>
  </div>

</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileNameEl = document.getElementById('fileName');
const analyzeBtn = document.getElementById('analyzeBtn');
const spinner = document.getElementById('spinner');
const statusMsg = document.getElementById('statusMsg');
const resultsCard = document.getElementById('resultsCard');
const statsRow = document.getElementById('statsRow');
const anovaSection = document.getElementById('anovaSection');
const chartsContainer = document.getElementById('chartsContainer');
const chartNote = document.getElementById('chartNote');
const downloadBtn = document.getElementById('downloadBtn');

let currentReportId = null;

['dragover','dragenter'].forEach(evt => dropZone.addEventListener(evt, e => {
  e.preventDefault(); dropZone.classList.add('drag');
}));
['dragleave','drop'].forEach(evt => dropZone.addEventListener(evt, e => {
  e.preventDefault(); dropZone.classList.remove('drag');
}));
dropZone.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    handleFileChosen();
  }
});
fileInput.addEventListener('change', handleFileChosen);

function handleFileChosen(){
  if (fileInput.files.length){
    fileNameEl.textContent = fileInput.files[0].name;
    analyzeBtn.disabled = false;
    statusMsg.textContent = '';
    statusMsg.classList.remove('err');
  }
}

analyzeBtn.addEventListener('click', async () => {
  if (!fileInput.files.length) return;
  spinner.style.display = 'block';
  statusMsg.textContent = 'Analyzing your data... (large files with many charts can take a minute or two)';
  statusMsg.classList.remove('err');
  analyzeBtn.disabled = true;
  resultsCard.classList.add('hidden');

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);

  try {
    const res = await fetch('/analyze', { method: 'POST', body: formData });

    const contentType = res.headers.get('content-type') || '';
    let data;
    if (contentType.includes('application/json')) {
      data = await res.json();
    } else {
      // Server (or a proxy in front of it) returned something that isn't JSON —
      // most often an HTML error page. Surface a readable message instead of
      // letting JSON.parse throw "Unexpected token '<'".
      const raw = await res.text();
      throw new Error(
        `Server returned an unexpected response (status ${res.status}). ` +
        `This usually means the request timed out or the file is too large/complex. ` +
        `Try a smaller file, or check the server logs. Details: ${raw.slice(0, 200)}`
      );
    }

    spinner.style.display = 'none';
    analyzeBtn.disabled = false;

    if (!res.ok || data.error) {
      statusMsg.textContent = data.error || `Analysis failed (status ${res.status}).`;
      statusMsg.classList.add('err');
      return;
    }
    statusMsg.textContent = 'Done!';
    currentReportId = data.report_id;
    renderResults(data);
  } catch (err) {
    spinner.style.display = 'none';
    analyzeBtn.disabled = false;
    statusMsg.textContent = 'Error: ' + err.message;
    statusMsg.classList.add('err');
  }
});

function renderResults(data){
  resultsCard.classList.remove('hidden');

  statsRow.innerHTML = `
    <div class="stat"><b>${data.n_rows}</b><span>Rows analyzed</span></div>
    <div class="stat"><b>${data.iv_cols.length}</b><span>Independent variables</span></div>
    <div class="stat"><b>${data.dv_cols.length}</b><span>Dependent variables</span></div>
    <div class="stat"><b>${data.total_charts}</b><span>Charts generated</span></div>
  `;

  const aiBadge = data.ai_used
    ? '<span style="background:#e6f4ea;color:#1a7f37;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;">✨ Written by Groq AI</span>'
    : '<span style="background:#eef1f5;color:#6b7280;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;">Built-in writer (no AI key set)</span>';

  if (data.anova){
    const sigClass = data.anova.significant ? 'sig-yes' : 'sig-no';
    const sigWord = data.anova.significant ? 'Significant (p < 0.05)' : 'Not significant (p ≥ 0.05)';
    anovaSection.innerHTML = `
      <div class="anova-box">
        <div style="margin-bottom:8px;">${aiBadge}</div>
        <b>One-Way ANOVA</b> — Overall attitude score grouped by <b>${data.anova.iv}</b><br>
        F = ${data.anova.F} &nbsp;|&nbsp; p = ${data.anova.p} &nbsp;|&nbsp;
        <span class="${sigClass}">${sigWord}</span>
      </div>
    `;
  } else {
    anovaSection.innerHTML = `<div class="anova-box">${aiBadge}<br>ANOVA could not be computed for this dataset.</div>`;
  }

  chartNote.textContent = `Showing a preview of ${Math.min(data.preview_charts.length, data.total_charts)} of ${data.total_charts} charts. The Word report includes all of them.`;

  chartsContainer.innerHTML = '';
  data.preview_charts.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chart-card';
    div.innerHTML = `
      <h4>${c.dv} — by ${c.iv}</h4>
      <img src="${c.img}" alt="chart">
      <div class="legend">${c.legend}</div>
    `;
    chartsContainer.appendChild(div);
  });
}

downloadBtn.addEventListener('click', () => {
  if (currentReportId){
    window.location.href = '/download/' + currentReportId;
  }
});
</script>

</body>
</html>
